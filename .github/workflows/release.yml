name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: claude-history

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds (use cargo directly)
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            platform: darwin-amd64
            use_cross: false
          # Linux builds (use cross with musl for static linking)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
            use_cross: true
          # Windows build (native cargo on windows-latest)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          bin_base="target/${{ matrix.target }}/release/${BIN_NAME}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="${bin_base}.exe"
          else
            bin="${bin_base}"
          fi
          # Only strip on Linux to avoid corrupting macOS code signatures
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            strip "$bin" || true
          fi
          archive="${BIN_NAME}-${{ matrix.platform }}.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$archive" "$(basename "$bin")"
          # shasum (Perl) is reliable on macOS; sha256sum is standard on Linux and
          # ships via git-bash on the Windows runner.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          else
            shasum -a 256 "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: raine/homebrew-claude-history
          token: ${{ secrets.RELEASE_TOKEN }}
          path: tap
      - name: Generate formula and push to tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SHA_ARM=$(awk '{print $1}' claude-history-darwin-arm64.sha256)
          SHA_INTEL=$(awk '{print $1}' claude-history-darwin-amd64.sha256)
          SHA_LINUX=$(awk '{print $1}' claude-history-linux-amd64.sha256)

          cat > tap/Formula/claude-history.rb << EOF
          class ClaudeHistory < Formula
            desc "Fuzzy-search Claude Code conversation history from the terminal"
            homepage "https://github.com/raine/claude-history"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/raine/claude-history/releases/download/v${VERSION}/claude-history-darwin-arm64.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/raine/claude-history/releases/download/v${VERSION}/claude-history-darwin-amd64.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              url "https://github.com/raine/claude-history/releases/download/v${VERSION}/claude-history-linux-amd64.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "claude-history"
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/claude-history --version")
            end
          end
          EOF
          sed -i 's/^          //' tap/Formula/claude-history.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/claude-history.rb
          git commit -m "claude-history ${VERSION}"
          git pull --rebase
          git push
